
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16a34a">
<title>Loanzyra</title>
<link rel="manifest" href="manifest.json">
<style>
* {
box-sizing: border-box;
}
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f3f6f4;
color: #17251c;
}
header {
background: #16a34a;
color: white;
padding: 25px 18px;
border-radius: 0 0 20px 20px;
}
header h1 {
margin: 0;
font-size: 28px;
}
main {
padding: 18px;
}
.card {
background: white;
padding: 20px;
border-radius: 15px;
margin-bottom: 16px;
}
</style>
</head>

<body>

<header>
<h1>Loanzyra</h1>
<p>Your Smart Loan Management App</p>
</header>

<main>

<div class="card">
<h2>Welcome to Loanzyra 👋</h2>
<p>Manage your loans easily.</p>
</div>

<div class="card">
<h3>Loan Calculator</h3>

<label>Loan Amount (₹)</label>
<input type="number" id="amount" placeholder="Enter loan amount">

<label>Annual Interest Rate (%)</label>
<input type="number" id="rate" placeholder="Enter interest rate">

<label>Loan Duration (Months)</label>
<input type="number" id="months" placeholder="Enter months">

<button onclick="calculateLoan()">Calculate EMI</button>

<h3 id="result">Monthly EMI: ₹0</h3>
</div>

</main>

<style>
input {
width: 100%;
padding: 13px;
margin: 8px 0 14px;
border: 1px solid #ddd;
border-radius: 9px;
font-size: 16px;
}

button {
width: 100%;
padding: 14px;
border: 0;
border-radius: 9px;
background: #16a34a;
color: white;
font-size: 16px;
font-weight: bold;
}

#result {
color: #16a34a;
}
</style>

<script>
function calculateLoan() {
const p = Number(document.getElementById("amount").value);
const r = Number(document.getElementById("rate").value) / 1200;
const n = Number(document.getElementById("months").value);

if (p <= 0 || r < 0 || n <= 0) {
alert("Please enter valid loan details.");
return;
}

const emi = r === 0
? p / n
: p * r * Math.pow(1 + r, n) /
(Math.pow(1 + r, n) - 1);

document.getElementById("result").innerText =
"Monthly EMI: ₹" + emi.toFixed(2);
}

if ("serviceWorker" in navigator) {
window.addEventListener("load", function() {
navigator.serviceWorker.register("./service-worker.js");
});
}
</script>

</body>
</html>
